mass_sendgrid.settings:
  type: config_object
  label: 'Mass.gov SendGrid settings'
  mapping:
    template_id:
      type: string
      label: 'SendGrid dynamic template ID'
    asm_group_id:
      type: integer
      label: 'SendGrid unsubscribe group ID'
    from_email:
      type: email
      label: 'SendGrid sender email address'
