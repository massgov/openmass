services:
  drupal:
    image: wodby/php:8.4-dev-4.70.10
    volumes:
      - .:/var/www/html:${VOLUME_FLAGS-rw}
    environment:
      DOCKER_ENV: ci
      APACHE_DOCROOT: /var/www/docroot
      MYSQL_USER: circle
      MYSQL_PASSWORD: circle
      MYSQL_DATABASE: circle
      MYSQL_HOST: mysql
      # Copy vars from host to the container.
      AC_API_USER: $AC_API_USER
      # Acquia Cloud - v2
      AC_API2_KEY:  $AC_API2_KEY
      AC_API2_SECRET: $AC_API2_SECRET
    links:
      - mysql
    working_dir: /var/www/html

  mysql:
    # See https://github.com/juampynr/mariadb-no-volume
    build: .
    environment:
      MYSQL_USER: circle
      MYSQL_PASSWORD: circle
      MYSQL_DATABASE: circle
      MYSQL_RANDOM_ROOT_PASSWORD: 1
    # --skip-log-bin: MySQL 8 writes binary logs by default. Here they record the
    # whole import and sanitize, about 12 GB that docker commit would bake into
    # the image. Nothing replicates from this server.
    command: --skip-log-bin --datadir=/var/lib/mysql-no-volume --max_allowed_packet=32M --innodb_flush_method=O_DIRECT --tmp_table_size=16M --innodb-flush-log-at-trx-commit=2 --innodb_buffer_pool_size=6G --innodb_log_buffer_size=64M --skip-innodb_doublewrite --innodb_log_file_size=128M
