id: media.media_video.field_video_descriptions
field_name: field_video_descriptions
entity_type: media
bundle: media_video
label: 'Audio descriptions (.vtt)'
description: 'Upload timed descriptions of important visual information, one WebVTT (.vtt) file per language. The player can read them aloud and include them in the interactive transcript. Match the language to the corresponding captions. Leave Audio-described video URL empty to use spoken WebVTT descriptions. If both are supplied, this player uses the alternate video for description playback and includes the WebVTT text in the interactive transcript.'
required: false
translatable: false
