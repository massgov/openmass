settings:
  handler: 'default:file'
  handler_settings: {  }
  file_directory: 'video-accessibility/[date:custom:Y]-[date:custom:m]'
  file_extensions: vtt
  max_filesize: '2 MB'
  description_field: true
field_type: mass_media_video_track
