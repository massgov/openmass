# This file comes from https://github.com/ddev/ddev-selenium-standalone-chrome
#
# Edited locally, so the add-on must not overwrite it: "w3c":true, because
# newer selenium/standalone-chromium images reject "w3c":false with "session
# not created". Chromedriver has defaulted to W3C since version 75, so this also
# matches the older image in .disabled-services. No --headless: headless Chrome
# opens an 800x600 window, the pages switch to the mobile layout and tests that
# click desktop-only elements fail. Without it Chrome uses the Selenium
# container's virtual display. CircleCI uses these values.
#
web_environment:
  - BROWSERTEST_OUTPUT_DIRECTORY=/var/www/html/docroot/sites/simpletest/browser_output
  - BROWSERTEST_OUTPUT_BASE_URL=${DDEV_PRIMARY_URL}
  - SIMPLETEST_BASE_URL=http://web
  - SIMPLETEST_DB=mysql://db:db@db/db
  # Use disable-dev-shm-usage instead of setting shm_usage
  # https://developers.google.com/web/tools/puppeteer/troubleshooting#tips
  # The format of chromeOptions is defined at https://chromedriver.chromium.org/capabilities
  - MINK_DRIVER_ARGS_WEBDRIVER=[\"chrome\", {\"browserName\":\"chrome\",\"goog:chromeOptions\":{\"w3c\":true,\"args\":[\"--disable-gpu\", \"--no-sandbox\", \"--disable-dev-shm-usage\"]}}, \"http://selenium-chrome:4444/wd/hub\"]
  # Nightwatch
  - DRUPAL_TEST_BASE_URL=http://web
  - DRUPAL_TEST_DB_URL=mysql://db:db@db/db
  - DRUPAL_TEST_WEBDRIVER_HOSTNAME=selenium-chrome
  - DRUPAL_TEST_WEBDRIVER_PORT=4444
  - DRUPAL_TEST_WEBDRIVER_PATH_PREFIX=/wd/hub
  - DRUPAL_TEST_WEBDRIVER_CHROME_ARGS=--disable-gpu --no-sandbox --disable-dev-shm-usage
  - DRUPAL_TEST_CHROMEDRIVER_AUTOSTART=false
  - DRUPAL_NIGHTWATCH_SEARCH_DIRECTORY=../
  - DRUPAL_NIGHTWATCH_IGNORE_DIRECTORIES=node_modules,vendor,.*,sites/*/files,sites/*/private,sites/simpletest
  - DRUPAL_NIGHTWATCH_OUTPUT=reports/nightwatch
  # DTT
  - DTT_BASE_URL=http://web
  - DTT_MINK_DRIVER_ARGS=[\"chrome\", {\"browserName\":\"chrome\",\"goog:chromeOptions\":{\"w3c\":true,\"args\":[\"--disable-gpu\", \"--no-sandbox\", \"--disable-dev-shm-usage\"]}}, \"http://selenium-chrome:4444/wd/hub\"]
