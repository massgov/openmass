#
# Write your changelog entry here. Every pull request must have a changelog yml file.
#
# Change types:
# #############################################################################
# You can use one of the following types:
#  - Added: For new features.
#  - Changed: For changes to existing functionality.
#  - Deprecated: For soon-to-be removed features.
#  - Removed: For removed features.
#  - Fixed: For any bug fixes.
#  - Security: In case of vulnerabilities.
#
# Format
# #############################################################################
# The format is crucial. Please follow the examples below. For reference, the requirements are:
#  - All 3 parts are required and you must include "Type", "description" and "issue".
#  - "Type" must be left aligned and followed by a colon.
#  - "description" must be indented with 2 spaces followed by a colon
#  - "issue" must be indented with 4 spaces followed by a colon.
#  - "issue" is for the Jira ticket number only e.g. DP-1234
#  - No extra spaces, indents, or blank lines are allowed.
#
# Example:
# #############################################################################
# Fixed:
#  - description: Fixes scrolling on edit pages in Safari.
#    issue: DP-13314
#
# You may add more than 1 description & issue for each type using the following format:
# Changed:
#  - description: Automating the release branch.
#    issue: DP-10166
#  - description: Second change item that needs a description.
#    issue: DP-19875
#  - description: Third change item that needs a description along with an issue.
#    issue: DP-19843
#
Added:
  - description: SME / Content Owner field added as option internal tracking field for authors.
    issue: DP-48795
  - description: SME / Content Owner column and exposed filter added to the advanced search, documents, content performance and accessibility report pages, not only to their CSV exports.
    issue: DP-48795
  - description: Names on the SME / Content Owner directory now link to an advanced search filtered by that owner. The directory itself moved under Reports at admin/reports/subject-matter-experts-content-owners and is limited to users who can administer site configuration.
    issue: DP-48795
  - description: The SME / Content Owner directory now lists how many pages and documents each owner is responsible for, when the owner was last updated, a link to rename or delete the term, and a name search.
    issue: DP-48795
Changed:
  - description: SME / Content Owner vocabulary now rejects duplicate term names, and adding the same owner twice to one page or document is now rejected with a message naming the owner.
    issue: DP-48795
  - description: SME / Content Owner now reads directly under Permission Groups on every content type that has it, and first on the Page Info tab where it does not, instead of landing in a different spot per type.
    issue: DP-48795
Fixed:
  - description: Page Info tab now shows in the correct region on form display settings for content types where it was marked hidden.
    issue: DP-48795
  - description: SME / Content Owner is no longer served by the public API, which exposed both the owner of a page and the list of every owner to anonymous clients.
    issue: DP-48795
  - description: On Decision the SME / Content Owner field sat outside the Page Info tab because it was listed in two field groups at once.
    issue: DP-48795
Security:
  - description: SME / Content Owner can now only be read by roles that already see the editorial listings, so the field stays internal even if something starts rendering it, and the owner vocabulary is withheld from the public API.
    issue: DP-48795
