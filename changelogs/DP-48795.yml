#
# Write your changelog entry here. Every pull request must have a changelog yml file.
#
# Change types:
# #############################################################################
# You can use one of the following types:
#  - Added: For new features.
#  - Changed: For changes to existing functionality.
#  - Deprecated: For soon-to-be removed features.
#  - Removed: For removed features.
#  - Fixed: For any bug fixes.
#  - Security: In case of vulnerabilities.
#
# Format
# #############################################################################
# The format is crucial. Please follow the examples below. For reference, the requirements are:
#  - All 3 parts are required and you must include "Type", "description" and "issue".
#  - "Type" must be left aligned and followed by a colon.
#  - "description" must be indented with 2 spaces followed by a colon
#  - "issue" must be indented with 4 spaces followed by a colon.
#  - "issue" is for the Jira ticket number only e.g. DP-1234
#  - No extra spaces, indents, or blank lines are allowed.
#
# Example:
# #############################################################################
# Fixed:
#  - description: Fixes scrolling on edit pages in Safari.
#    issue: DP-13314
#
# You may add more than 1 description & issue for each type using the following format:
# Changed:
#  - description: Automating the release branch.
#    issue: DP-10166
#  - description: Second change item that needs a description.
#    issue: DP-19875
#  - description: Third change item that needs a description along with an issue.
#    issue: DP-19843
#
Added:
  - description: Authors can tag pages and documents with one or more SME / content owners, an optional internal tracking field on the Page Info tab that suggests existing owners and accepts new ones.
    issue: DP-48795
  - description: Pages and documents can be searched and filtered by SME / content owner, which appears as a column on the advanced search, documents, content performance, Editoria11y and accessibility report pages and in their CSV exports.
    issue: DP-48795
  - description: A directory of SME / content owners at admin/reports/subject-matter-experts-content-owners lists each owner with the number of pages and documents they are responsible for, links through to that content, and a name search. It is limited to users who can administer site configuration.
    issue: DP-48795
  - description: Duplicate owners are rejected. The vocabulary refuses a second term with an existing name, and the same owner cannot be attached twice to one page or document.
    issue: DP-48795
Fixed:
  - description: The Page Info tab shows in the correct region on the form display settings screen for the content types where it was marked hidden.
    issue: DP-48795
Security:
  - description: SME / content owner data stays internal. It is not rendered on published pages or carried in their metadata, the field and its vocabulary are withheld from the public API, and only roles that can already see the editorial listings are able to read it.
    issue: DP-48795
